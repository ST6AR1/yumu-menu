<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4ece1">
<title>芸莯 線上手冊</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading" class="loading">
  <div class="loading-mark">芸莯</div>
  <div class="loading-spinner"></div>
</div>

<header class="topbar">
  <button id="tocBtn" class="icon-btn" aria-label="目錄">
    <svg viewBox="0 0 24 24" width="17" height="17"><line x1="3.5" y1="8.5" x2="20.5" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="3.5" y1="15.5" x2="15" y2="15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
  <div class="page-indicator" id="pageIndicator">1 / 1</div>
</header>

<main class="stage">
  <div id="book" class="book"></div>

  <button id="prevBtn" class="nav-btn nav-prev" aria-label="上一頁">
    <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M15.5 4.5 8 12l7.5 7.5 1.4-1.4L10.8 12l6.1-6.1z"/></svg>
  </button>
  <button id="nextBtn" class="nav-btn nav-next" aria-label="下一頁">
    <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="m8.5 4.5-1.4 1.4L13.2 12l-6.1 6.1 1.4 1.4L16 12z"/></svg>
  </button>
</main>

<div class="hint" id="swipeHint">左右滑動或點兩側翻頁</div>

<div id="tocOverlay" class="toc-overlay" hidden>
  <div class="toc-panel">
    <div class="toc-header">
      <img class="toc-logo" src="assets/logo-horizontal-ink.svg" alt="芸莯 YUMU">
      <button id="tocClose" class="close-btn" aria-label="關閉">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.71 12 12.01l-6.3-6.3-1.41 1.41 6.3 6.3-6.3 6.29 1.41 1.41 6.3-6.29 6.3 6.29 1.41-1.41-6.3-6.29 6.3-6.3z"/></svg>
      </button>
    </div>
    <div class="toc-caption">目錄　<span>MENU</span></div>
    <div class="toc-list" id="tocList"></div>
  </div>
</div>

<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
